# latest configuration file for 2 boards

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f429xx_xxxxxxxxxxxxxxxxxxxxxxxx-if00
restart_method: command

[mcu zboard]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_xxxxxxxxxxxxxxxxxxxxxxxx-if00
restart_method: command

[printer]
kinematics: corexyrotab
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200 
endstop_pin: tmc2209_stepper_x:virtual_endstop #PG6 #
position_min: -125
homing_speed: 20
homing_retract_dist: 0
position_endstop: 75.5
position_max: 76
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: ^PG6
driver_SGTHRS: 64
run_current: 0.800
stealthchop_threshold: 999999 # 0 strong 999999 smooth

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_y:virtual_endstop #PG9 #
position_endstop: -56
homing_speed: 15  
homing_retract_dist: 0
position_max: 200
position_min: -57
homing_positive_dir: false

[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: ^PG9
driver_SGTHRS: 20
run_current: 0.800
stealthchop_threshold: 999999

[gcode_macro global]
variable_xy_run_current:  0.8
variable_xy_home_current: 0.59
gcode:

#### Macros to implement sensorless homing
[gcode_macro _HOME_X]
gcode:
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer["gcode_macro global"].xy_home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer["gcode_macro global"].xy_home_current}

    G4 P500

    G28 X

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer["gcode_macro global"].xy_run_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer["gcode_macro global"].xy_run_current}
    
    G90
    G1 X0 F1200
    G4 P500 
[gcode_macro _HOME_Y]
gcode:
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer["gcode_macro global"].xy_home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer["gcode_macro global"].xy_home_current}

    G4 P500

    G28 Y

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer["gcode_macro global"].xy_run_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer["gcode_macro global"].xy_run_current}
    
    G90
    G1 Y0 F1200
    G4 P500 

[gcode_macro _HOME_Z]
gcode:
    G4 P500
    G28 Z
    G4 P500 

[gcode_macro _HOME_A]
gcode:
    G4 P500
    G28 A
    G90
    G1 A0 F120
    G4 P500 

[gcode_macro _HOME_B]
gcode:
    G4 P500
    G28 B
    G90
    G1 B0 F120
    G4 P500 

[homing_override]
gcode:
    _HOME_Z
    _HOME_X
    _HOME_Y
    _HOME_A
    _HOME_B

[gcode_macro HOME]
gcode:
    _HOME_Z
    _HOME_X
    _HOME_Y
    _HOME_A
    G28 B

[gcode_macro TAKE_1]
gcode:
    G1 X-90.7 F250
    G1 Y191 F250
    G1 X-80.5 F250
    G1 Y0 F250

[gcode_macro PUT_1]
gcode:
    G1 X-82 F250
    G1 Y191 F250
    G1 X-91.5 F250
    G1 Y0 F250

[gcode_macro TAKE_2]
gcode:
    G1 X59.5 F250
    G1 Y199 F250
    G1 X69.5 F250
    G1 Y0 F250 

[gcode_macro PUT_2]
gcode:
    G1 X68.5 F250
    G1 Y199 F250
    G1 X58.5 F250
    G1 Y0 F250    

