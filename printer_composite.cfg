[extruder]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
microsteps: 16
rotation_distance: 8.48637
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2 # HE0
sensor_pin: PF3 # T0
sensor_type: PT1000
pullup_resistor : 47000
control: pid
pid_kp: 15.262
pid_ki: 0.807
pid_kd: 72.111
min_temp: 0
max_temp: 300
min_extrude_temp: 10

[extruder_stepper extruder2]
extruder: extruder
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 8.48637

[extruder1]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 19
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA3 # HE0
sensor_pin: PF4 # T0
sensor_type: PT1000
pullup_resistor : 47000
control: pid
pid_kp: 15.262
pid_ki: 0.807
pid_kd: 72.111
min_temp: 0
max_temp: 300
min_extrude_temp: 10

[gcode_macro T3]
gcode:
  ACTIVATE_EXTRUDER extruder=extruder1
 
[gcode_macro T0]#fiber
gcode:
    # Deactivate stepper in motion queue
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={32.3}
    # Activate stepper in motion queue
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder

[gcode_macro T1]#plastic
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder2 DISTANCE={7.6}
    # Activate stepper in motion queue
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder

[gcode_macro T2]#virtual
gcode:
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={32.3*2} # 50%
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder # Add e0
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder # Add e1
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder2 DISTANCE={7.6*2} # 50%

[gcode_macro M163]
gcode:

  {% set rot_dist0 = params.ROT_DIST_0|default(32.3)|float %} # define in default the rotation distance of the extruder
  {% set rot_dist1 = params.ROT_DIST_1|default(7.6)|float %} # define in default the rotation distance of the extruder
  {% if 'P' in params %}
	  {% if params.P|float == 0  %}
		#Set T0
	    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=
	    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={32.3}
	    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    {% elif params.P|float == 100 %}
		# Set T1
	    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
	    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder2 DISTANCE={7.6}
	    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder
	  {% else %}
    # Set Mix
		  SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={ rot_dist0 * 100/(100-params.P|float) }
		  SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder # Add e0
		  SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder # Add e1
		  SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder2 DISTANCE={ rot_dist1 * 100/params.P|float }
	  {% endif %}
  {% else %}
      # default 50% mix
      SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={rot_dist0 * 2 }
      SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder # Add e0
      SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder # Add e1
      SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder2 DISTANCE={rot_dist1 * 2 }
  {% endif %}

[heater_fan fan1]
pin: PD14
heater: extruder
heater_temp: 45
fan_speed: 1.0


[heater_fan fan2]
pin: PD13
heater: extruder1
heater_temp: 45
fan_speed: 1.0
